name: publish-create

# Publishes packages/create-antigravity-sidecar. Push a tag matching its package.json version,
# e.g. `git tag create-v1.0.0 && git push origin create-v1.0.0`.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret; provenance is attached automatically.
on:
  push:
    tags: ['create-v*']

permissions:
  contents: read

concurrency:
  group: publish-create
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # required for trusted publishing and provenance
    defaults:
      run:
        working-directory: packages/create-antigravity-sidecar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use an npm with trusted publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "create-v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version create-v${version}"
            exit 1
          fi
      - name: Check the kit version it depends on is already on npm
        run: |
          range="$(node -p "require('./package.json').dependencies['antigravity-sidecar-kit']")"
          if [ -z "$(npm view "antigravity-sidecar-kit@${range}" version)" ]; then
            echo "::error::antigravity-sidecar-kit@${range} is not published yet; release the kit first"
            exit 1
          fi
      - name: Smoke test (packs the kit and the wrapper together)
        working-directory: .
        run: npm run test:pack
      - run: npm publish --provenance --access public
